<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Booth app">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'">
<title>Canton booth app</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg:#f4f6fb; --surface:#fff; --surface-2:#f8fafc; --ink:#0f172a; --ink-2:#334155; --mut:#64748b; --line:#e2e8f0;
  --acc:#4338ca; --acc-2:#eef2ff; --ok:#047857; --ok-2:#ecfdf5; --warn:#b45309; --warn-2:#fffbeb; --bad:#b91c1c; --bad-2:#fef2f2;
  --ca:#be123c; --ca-2:#fff1f2; --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.05);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0b1020; --surface:#121a2e; --surface-2:#0f1628; --ink:#e5e9f5; --ink-2:#c3cbe0; --mut:#8b96b3; --line:#223052;
    --acc:#8b9cff; --acc-2:#1c2550; --ok:#34d399; --ok-2:#0d2a22; --warn:#fbbf24; --warn-2:#2b2210; --bad:#f87171; --bad-2:#2d1416;
    --ca:#fb7185; --ca-2:#2d1420; --shadow:none; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--ink); }
body { font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font:inherit; color:inherit; }
.hidden { display:none !important; }

/* top bar */
.top { position:sticky; top:0; z-index:20; padding:calc(var(--safe-t) + 10px) 16px 10px; background:var(--bg); background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px); display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); }
.top h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon-btn { border:0; background:var(--surface); box-shadow:var(--shadow); width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:var(--ink-2); }
.sync { border:0; display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:7px 11px; border-radius:99px; background:var(--ok-2); color:var(--ok); white-space:nowrap; }
.sync.wait { background:var(--warn-2); color:var(--warn); } .sync.bad { background:var(--bad-2); color:var(--bad); } .sync.run { background:var(--acc-2); color:var(--acc); }
.dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
.sync.run .dot { animation:pulse 1s infinite; } @keyframes pulse { 50% { opacity:.25; } }

main { padding:14px 16px calc(96px + var(--safe-b)); max-width:760px; margin:0 auto; }
.eyebrow { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin:18px 2px 8px; }

/* day selector */
.days { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:2px 16px 6px; scroll-snap-type:x mandatory; }
.days::-webkit-scrollbar { display:none; }
.day { flex:none; scroll-snap-align:start; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:9px 12px; min-width:94px; text-align:left; }
.day b { display:block; font-size:14px; } .day span { font-size:12px; color:var(--mut); }
.day.on { background:var(--acc); border-color:var(--acc); color:#fff; } .day.on span { color:#e0e7ff; }
.bar { height:4px; border-radius:4px; background:var(--line); margin-top:6px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--ok); }
.day.on .bar { background:rgba(255,255,255,.3); } .day.on .bar i { background:#fff; }

.card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line); padding:14px; margin:10px 0; }
.summary { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.kpi b { display:block; font-size:20px; } .kpi span { font-size:12px; color:var(--mut); }
.halls { font-size:13px; color:var(--mut); margin-top:10px; }

/* stop list */
.stop { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:13px 14px; margin:8px 0; box-shadow:var(--shadow); }
.stop:active, .result:active, .note-card:active { transform:scale(.995); }
.when { flex:none; width:46px; text-align:center; }
.when b { display:block; font-size:13px; } .num { margin:4px auto 0; width:28px; height:28px; border-radius:50%; background:var(--acc-2); color:var(--acc); font-weight:700; font-size:13px; display:grid; place-items:center; }
.num.done { background:var(--ok); color:#fff; }
.body { flex:1; min-width:0; }
.booth { font-weight:700; font-size:15px; } .name { margin-top:1px; } .meta { font-size:13px; color:var(--mut); margin-top:2px; }
.tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.tag { font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--acc-2); color:var(--acc); }
.tag.ca { background:var(--ca-2); color:var(--ca); } .tag.ok { background:var(--ok-2); color:var(--ok); } .tag.warn { background:var(--warn-2); color:var(--warn); } .tag.bad { background:var(--bad-2); color:var(--bad); }
.lunch { text-align:center; font-size:12px; color:var(--mut); margin:10px 0; }
.walk { font-size:11.5px; color:var(--mut); margin:-2px 0 0 60px; }

/* search */
.search { position:relative; } .search input { padding-left:40px; }
.search svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--mut); }
.seg { display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px; }
.seg button { flex:1; border:0; background:none; padding:9px 6px; border-radius:9px; font-size:14px; font-weight:600; color:var(--mut); }
.seg button.on { background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
.seg.status button.on[data-v=visited] { color:var(--ok); } .seg.status button.on[data-v=revisit] { color:var(--warn); } .seg.status button.on[data-v=skipped] { color:var(--bad); }
.result, .note-card { display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:13px 14px; margin:8px 0; box-shadow:var(--shadow); }
.empty { text-align:center; color:var(--mut); padding:28px 10px; }
.note-text { font-size:14px; color:var(--ink-2); margin-top:6px; white-space:pre-wrap; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }

/* fields */
label.f { display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin:12px 0 5px; }
input.i, select.i, textarea.i { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2); font-size:16px; outline:none; }
input.i:focus, select.i:focus, textarea.i:focus { border-color:var(--acc); background:var(--surface); box-shadow:0 0 0 3px var(--acc-2); }
textarea.i { min-height:170px; resize:vertical; line-height:1.5; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 8px; }
.section-title { display:flex; align-items:center; justify-content:space-between; font-size:15px; font-weight:700; margin:0 0 4px; }
.link { border:0; background:none; color:var(--acc); font-weight:600; font-size:14px; padding:4px 0; }
.stars { display:flex; gap:4px; } .stars button { border:0; background:none; font-size:28px; line-height:1; padding:2px; color:var(--line); }
.stars button.on { color:#f59e0b; }
.hint { font-size:12.5px; color:var(--mut); margin-top:6px; }
.ask { background:var(--acc-2); color:var(--ink-2); border-radius:12px; padding:10px 12px; font-size:14px; margin-top:10px; }
.team-note { background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:8px; font-size:14px; white-space:pre-wrap; }

/* buttons */
.btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:0; border-radius:14px; padding:14px; font-size:16px; font-weight:700; background:var(--acc); color:#fff; }
.btn.ghost { background:var(--surface); color:var(--acc); border:1px solid var(--line); }
.btn.danger { background:var(--bad-2); color:var(--bad); }
.btn:disabled { opacity:.55; }
.photo-actions { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:6px; }
.photo-actions label { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px; border:1px dashed var(--acc); color:var(--acc); border-radius:12px; font-size:13px; font-weight:600; background:var(--acc-2); }
.thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:8px; margin-top:12px; }
.thumb { position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line); }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb .ph { position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-size:11px; color:var(--mut); padding:6px; word-break:break-all; }
.thumb .k { position:absolute; left:5px; bottom:5px; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:99px; background:rgba(15,23,42,.72); color:#fff; }
.thumb .s { position:absolute; right:5px; bottom:5px; width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:11px; color:#fff; background:var(--warn); }
.thumb .s.ok { background:var(--ok); } .thumb .s.bad { background:var(--bad); }
.thumb .x { position:absolute; right:4px; top:4px; width:24px; height:24px; border-radius:50%; border:0; background:rgba(15,23,42,.72); color:#fff; font-size:14px; line-height:1; }

/* bottom tabs */
.tabs { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:space-around; align-items:center; padding:6px 8px calc(6px + var(--safe-b));
  background:var(--surface); background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); }
.tab { flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11.5px; font-weight:600; color:var(--mut); padding:6px 0; }
.tab.on { color:var(--acc); }
.fab { flex:none; width:56px; height:56px; margin-top:-26px; border-radius:18px; border:0; background:var(--acc); color:#fff; box-shadow:0 8px 20px rgba(67,56,202,.35); display:grid; place-items:center; }

/* sheets & dialogs */
.sheet { position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; }
.sheet .top { z-index:41; }
.sheet main { padding-bottom:calc(110px + var(--safe-b)); }
.savebar { position:fixed; left:0; right:0; bottom:0; z-index:42; padding:10px 16px calc(10px + var(--safe-b)); background:var(--bg); background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line); }
.savebar .btn { max-width:728px; margin:0 auto; }
.editor { position:fixed; inset:0; z-index:60; background:var(--surface); display:flex; flex-direction:column; padding:calc(var(--safe-t) + 10px) 14px calc(10px + var(--safe-b)); }
.editor textarea { flex:1; border:0; outline:none; background:none; font-size:17px; line-height:1.55; resize:none; padding:8px 2px; }
.editor .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
.qr-btn { margin:2px 0 4px; }
.voice-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.voice-actions .btn { padding:12px 8px; font-size:14.5px; }
.clips { display:grid; gap:8px; margin-top:10px; }
.clip { border:1px solid var(--line); border-radius:12px; padding:8px 10px; background:var(--surface-2); }
.clip-top { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--acc); }
.clip-top b { color:var(--ink); } .clip-top .hint { margin:0; flex:1; }
.clip-top .x { border:0; background:none; color:var(--bad); font-size:22px; line-height:1; padding:0 4px; }
.clip audio { display:block; width:100%; height:40px; margin-top:6px; }
.rec .dialog h2 { display:flex; align-items:center; gap:10px; }
.rec-dot { width:12px; height:12px; border-radius:50%; background:var(--bad); animation:pulse 1s infinite; }
.rec-time { font-size:44px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; margin:6px 0 2px; }
.rec-msg { text-align:center; color:var(--ink-2); font-size:14.5px; margin-bottom:14px; }
.scan { position:fixed; inset:0; z-index:85; background:#000; overflow:hidden; }
.scan video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.scan-frame { position:absolute; left:50%; top:42%; width:min(70vw, 320px); height:min(70vw, 320px); transform:translate(-50%, -50%); border:3px solid rgba(255,255,255,.92); border-radius:18px; box-shadow:0 0 0 100vmax rgba(0,0,0,.38); pointer-events:none; }
.scan.nocam .scan-frame, .scan.nocam video { display:none; }
.scan-msg { position:absolute; left:16px; right:16px; top:calc(var(--safe-t) + 18px); color:#fff; text-align:center; font-weight:700; font-size:16px; line-height:1.4; text-shadow:0 1px 3px rgba(0,0,0,.7); }
.scan.nocam .scan-msg { top:30%; font-weight:600; }
.scan-bar { position:absolute; left:0; right:0; bottom:0; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px 12px calc(14px + var(--safe-b)); background:linear-gradient(transparent, rgba(0,0,0,.7)); }
.scan-bar .btn:last-child { grid-column:1 / -1; }
@media (min-width: 900px) { .scan-bar { max-width:560px; margin:0 auto; } }
.scrim { position:fixed; inset:0; z-index:80; background:rgba(2,6,23,.45); display:flex; align-items:flex-end; justify-content:center; padding:16px 12px calc(16px + var(--safe-b)); }
.dialog { width:100%; max-width:440px; background:var(--surface); border-radius:20px; padding:18px; box-shadow:0 20px 50px rgba(2,6,23,.3); }
.dialog h2 { margin:0 0 6px; font-size:18px; } .dialog p { margin:0 0 14px; color:var(--ink-2); font-size:15px; white-space:pre-wrap; max-height:55vh; overflow-y:auto; }
.dialog .btn + .btn { margin-top:8px; }
.toast { position:fixed; left:50%; bottom:calc(88px + var(--safe-b)); transform:translateX(-50%); z-index:90; background:#0f172a; color:#fff; padding:11px 16px; border-radius:12px; font-size:14px; font-weight:600; box-shadow:0 10px 30px rgba(2,6,23,.3); max-width:90vw; }

/* onboarding */
.welcome { min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:calc(var(--safe-t) + 24px) 22px calc(24px + var(--safe-b)); max-width:460px; margin:0 auto; }
.logo { width:64px; height:64px; border-radius:18px; background:var(--acc); display:grid; place-items:center; color:#fff; margin-bottom:16px; box-shadow:0 10px 24px rgba(67,56,202,.35); }
.welcome h1 { margin:0; font-size:26px; letter-spacing:-.02em; } .welcome .sub { color:var(--mut); margin:6px 0 18px; }
.err { color:var(--bad); font-size:14px; margin-top:10px; min-height:20px; }
.kv { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
.kv:last-child { border-bottom:0; } .kv span:first-child { color:var(--mut); }
.card.now { border-left:4px solid var(--acc); }
button.card.now { width:100%; text-align:left; }

/* booth questions (reference) */
.qref > summary { list-style:none; cursor:pointer; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.qref > summary::-webkit-details-marker { display:none; }
.qref > summary::after { content:'\25be'; color:var(--mut); margin-left:auto; } .qref[open] > summary::after { content:'\25b4'; }
.qref ol { margin:10px 0 0; padding-left:22px; }
.qref li { font-size:15px; line-height:1.45; padding:5px 0; border-bottom:1px solid var(--line); }
.qref li:last-child { border-bottom:0; }

/* laptops and tablets */
@media (min-width: 900px) {
  main { max-width:980px; padding-left:24px; padding-right:24px; }
  .top { padding-left:max(24px, calc(50% - 466px)); padding-right:max(24px, calc(50% - 466px)); }
  .tabs { padding-left:calc(50% - 360px); padding-right:calc(50% - 360px); }
  .days { margin:0; padding:2px 0 6px; flex-wrap:wrap; }
  .scrim { align-items:center; }
  .sheet main { max-width:860px; }
  .savebar .btn { max-width:820px; }
  .toast { bottom:100px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
